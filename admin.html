<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline auth-action">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html">마이페이지</a></li>
        <li><a href="#" class="logout-btn">로그아웃</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 1200px;">
    <h2>관리자 대시보드</h2>
    <p style="margin-bottom: 20px;">모든 사용자의 데이터를 실시간으로 관리할 수 있습니다.</p>

    <div class="card" style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 800px;">
        <thead>
          <tr style="border-bottom: 2px solid var(--input-border);">
            <th style="padding: 10px;">UUID</th>
            <th style="padding: 10px;">닉네임(ID)</th>
            <th style="padding: 10px;">비밀번호</th>
            <th style="padding: 10px;">계좌번호</th>
            <th style="padding: 10px;">권한 설정</th>
            <th style="padding: 10px;">관리</th>
          </tr>
        </thead>
        <tbody id="admin-user-tbody">
          <tr>
            <td colspan="6" style="padding: 20px; text-align: center;">데이터를 불러오는 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
