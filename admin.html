<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ ADMIN - 관리자 페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>
</head>
<body>

    <header>
        <a class='logo' href='/' id="siteLogo">⚙️ <strong>ADMIN PANEL</strong></a>
        <div class="nav-group" id="navGroup">
            <nav>
                <ul>
                    <li><a href='/'><i class="fas fa-home"></i> 홈으로</a></li>
                </ul>
            </nav>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <main class="container">
        <h2><i class="fas fa-shield-alt"></i> 관리진 전용 대시보드</h2>
        <p style="color: var(--text-sub); margin-bottom: 20px; font-size: 0.9rem;">회원 권한 설정 및 사이트 환경을 관리할 수 있습니다.</p>

        <!-- 1. 사이트 환경 설정 섹션 -->
        <section class="card glass-panel" style="margin-bottom: 20px;">
            <h3><i class="fas fa-sliders-h"></i> 사이트 환경 설정</h3>
            <div style="margin-top: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-sub);">사이트 타이틀 (로고명)</label>
                <input type="text" id="settingSiteTitle" class="input-modern" placeholder="예: ⚙️ MARKET" style="margin-top: 5px;">
                
                <label style="font-size: 0.85rem; color: var(--text-sub); display: block; margin-top: 10px;">상단 긴급 공지 텍스트</label>
                <input type="text" id="settingNoticeText" class="input-modern" placeholder="공지 내용 입력 (비워두면 숨김)" style="margin-top: 5px;">
                
                <button class="btn-auth" style="margin-top: 10px;" onclick="saveSiteSettings()">설정 저장하기</button>
            </div>
        </section>

        <!-- 2. 회원 권한 관리 섹션 -->
        <section class="card glass-panel">
            <h3><i class="fas fa-users-cog"></i> 회원 목록 및 권한 설정</h3>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin: 5px 0 15px 0;">
                역할 순위: 1. 관리진 &gt; 2. 특수회원 &gt; 3. 판매자 &gt; 4. 일반회원
            </p>
            <div id="userManagementList">
                <p>회원 목록을 불러오는 중...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ⚙️ MARKET Admin. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 테마 아이콘 동기화
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn && document.body.classList.contains('light-mode')) {
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }

            // 관리진 권한 체크 (관리진 또는 관리자 허용)
            const role = localStorage.getItem('currentUserRole');
            if (role !== '관리진' && role !== '관리자') {
                alert('관리진만 접근할 수 있는 페이지입니다.');
                location.href = '/';
                return;
            }

            fetchUsersForAdmin();
            loadCurrentSettings();
        });

        // 👥 회원 목록 불러오기 (id 컬럼 대신 nickname 기준 조회)
        async function fetchUsersForAdmin() {
            const container = document.getElementById('userManagementList');
            try {
                const { data, error } = await db.from('users').select('*').order('nickname', { ascending: true });
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `<p>가입된 회원이 없습니다.</p>`;
                    return;
                }

                container.innerHTML = data.map(u => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                        <div>
                            <strong>${u.nickname}</strong> 
                            <span style="font-size: 0.8rem; color: var(--text-sub); margin-left: 8px;">(비밀번호: ${u.password})</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <select id="role-${u.nickname}" class="input-modern" style="margin-bottom: 0; padding: 6px 10px; font-size: 0.85rem;">
                                <option value="관리진" ${u.role === '관리진' || u.role === '관리자' ? 'selected' : ''}>관리진</option>
                                <option value="특수회원" ${u.role === '특수회원' ? 'selected' : ''}>특수회원</option>
                                <option value="판매자" ${u.role === '판매자' ? 'selected' : ''}>판매자</option>
                                <option value="일반회원" ${!u.role || u.role === '일반회원' ? 'selected' : ''}>일반회원</option>
                            </select>
                            <button class="btn-auth" style="padding: 6px 12px; font-size: 0.85rem; width: auto;" onclick="updateUserRole('${u.nickname}')">변경</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color: var(--accent-red, #ff4757);">회원 목록을 불러오는 중 오류가 발생했습니다: ${err.message}</p>`;
            }
        }

        // 🔄 회원 권한 업데이트
        async function updateUserRole(nickname) {
            const selectElem = document.getElementById(`role-${nickname}`);
            const newRole = selectElem.value;

            const { error } = await db.from('users').update({ role: newRole }).eq('nickname', nickname);
            if (error) {
                alert('권한 변경 실패: ' + error.message);
            } else {
                alert(`[${nickname}]님의 권한이 [${newRole}](으)로 변경되었습니다.`);
                fetchUsersForAdmin();
            }
        }

        // ⚙️ 사이트 설정 저장
        function saveSiteSettings() {
            const title = document.getElementById('settingSiteTitle').value.trim();
            const notice = document.getElementById('settingNoticeText').value.trim();

            if (title) localStorage.setItem('customSiteTitle', title);
            localStorage.setItem('siteNotice', notice);

            alert('사이트 설정이 저장되었습니다!');
            location.reload();
        }

        function loadCurrentSettings() {
            const savedTitle = localStorage.getItem('customSiteTitle');
            const savedNotice = localStorage.getItem('siteNotice');
            if (savedTitle) document.getElementById('settingSiteTitle').value = savedTitle;
            if (savedNotice) document.getElementById('settingNoticeText').value = savedNotice;
        }
    </script>
</body>
</html>
