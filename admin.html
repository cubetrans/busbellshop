<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베스벨샵 - 관리자 페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <a href="/" class="logo">
            <img src="assets/logo.png" alt="베스벨샵" class="site-logo">
        </a>
        <span>관리자 모드 👑</span>
    </header>

    <main class="container" style="max-width: 800px; margin: 30px auto; padding: 0 20px;">
        <section class="card glass-panel">
            <h2><Image> 🖼️ index 상단 배너 이미지 관리</h2>
            <p style="font-size: 0.9rem; color: var(--text-sub);">메인 페이지(index.html) 상단에 노출될 배너 이미지의 URL을 변경합니다.</p>
            
            <form id="bannerForm" onsubmit="saveBannerUrl(event)" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <label style="font-size: 0.85rem; color: var(--text-sub);">배너 이미지 웹 링크(URL)</label>
                <input type="url" id="bannerUrlInput" placeholder="https://example.com/banner.png" class="input-modern" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);" required>
                <button type="submit" class="btn-primary" style="padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">배너 이미지 교체하기</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            // 현재 저장된 배너 URL 불러오기
            try {
                const { data } = await db.from('settings').select('*').eq('key', 'top_banner_url').maybeSingle();
                if (data) {
                    document.getElementById('bannerUrlInput').value = data.value;
                }
            } catch(e) {
                console.error(e);
            }
        });

        async function saveBannerUrl(e) {
            e.preventDefault();
            const newUrl = document.getElementById('bannerUrlInput').value.trim();
            
            // Supabase settings 테이블에 업서트 (없으면 생성, 있으면 수정)
            const { error } = await db.from('settings').upsert({ key: 'top_banner_url', value: newUrl });

            if (error) {
                alert('배너 변경 실패: ' + error.message);
            } else {
                alert('메인 상단 배너가 성공적으로 변경되었습니다!');
            }
        }
    </script>
</body>
</html>
