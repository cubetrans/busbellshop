<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h2>주문 관리 페이지</h2>
    <table>
      <thead><tr><th>구매자</th><th>상품</th><th>상태</th><th>관리</th></tr></thead>
      <tbody id="order-list"></tbody>
    </table>
  </main>

  <script>
    async function loadOrders() {
      const { data } = await supabaseClient.from('orders').select('*');
      const list = document.getElementById('order-list');
      list.innerHTML = data.map(o => `
        <tr>
          <td>${o.buyer_nickname}</td>
          <td>${o.item_title}</td>
          <td>${o.status}</td>
          <td>
            <select onchange="updateStatus(${o.id}, this.value)">
              <option ${o.status=='입금대기'?'selected':''}>입금대기</option>
              <option ${o.status=='처리중'?'selected':''}>처리중</option>
              <option ${o.status=='보류'?'selected':''}>보류</option>
              <option ${o.status=='처리 완료'?'selected':''}>처리 완료</option>
              <option ${o.status=='처리 불가'?'selected':''}>처리 불가</option>
            </select>
          </td>
        </tr>
      `).join('');
    }
    async function updateStatus(id, val) {
      await supabaseClient.from('orders').update({status: val}).eq('id', id);
      loadOrders();
    }
    loadOrders();
  </script>
</body>
</html>
