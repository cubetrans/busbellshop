<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 1200px;">
    <h2>관리자 대시보드</h2>
    <p style="margin-bottom: 20px;">모든 사용자의 데이터를 실시간으로 관리할 수 있습니다.</p>

    <div class="card" style="margin-bottom: 20px;">
      <h3>긴급공지 관리</h3>
      <form id="emergency-form">
        <textarea id="emergency-input" rows="3" placeholder="긴급공지 내용을 입력하세요" style="width: 100%; padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px; margin-bottom: 10px;"></textarea>
        <button type="submit" class="btn btn-primary">긴급공지 저장/수정</button>
      </form>
    </div>
    
    <div class="card" style="overflow-x: auto; margin-bottom: 20px;">
      <h3>사용자 관리</h3>
      <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 800px;">
        <thead>
          <tr>
            <th style="padding: 10px;">닉네임</th>
            <th style="padding: 10px;">역할</th>
            <th style="padding: 10px;">은행명</th>
            <th style="padding: 10px;">계좌번호</th>
            <th style="padding: 10px;">예금주</th>
            <th style="padding: 10px;">관리</th>
          </tr>
        </thead>
        <tbody id="admin-users-tbody"></tbody>
      </table>
    </div>

    <div class="card" style="overflow-x: auto;">
      <h3>전체 주문 관리</h3>
      <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 800px;">
        <thead>
          <tr style="border-bottom: 2px solid var(--input-border);">
            <th style="padding: 10px;">구매자</th>
            <th style="padding: 10px;">판매자</th>
            <th style="padding: 10px;">상품명</th>
            <th style="padding: 10px;">입금자명</th>
            <th style="padding: 10px;">상태 설정</th>
            <th style="padding: 10px;">사유</th>
            <th style="padding: 10px;">관리</th>
          </tr>
        </thead>
        <tbody id="admin-orders-tbody">
          <tr><td colspan="7" style="padding: 20px; text-align: center;">로딩중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 관리자 채팅 관리 섹션 -->
<div id="admin-chat-section" style="margin-top:30px; padding:20px; border:1px solid #eee;">
  <h2>채팅 관리함</h2>
  <div id="admin-chat-list"></div>
</div>

<script>
  // 페이지 로드 시 관리자 채팅 목록 실행
  document.addEventListener('DOMContentLoaded', () => {
    // 관리자 여부 확인 후 실행
    renderAdminChatList();
  });
</script>

  <!-- 우측 하단 동그란 채팅 버튼 -->
<button id="floating-chat-btn" onclick="openChatModal('admin')" 
  style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#356fd4; color:white; border:none; font-size:24px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:9999;">
  💬
</button>

<!-- 채팅창 모달 (기존과 동일) -->
<div id="chat-modal" style="display:none; position:fixed; bottom:90px; right:20px; width:300px; height:400px; background:white; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:9998; border-radius:8px; flex-direction:column;">
  <div style="padding:10px; background:#356fd4; color:white; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; border-radius:8px 8px 0 0;">
    <span id="chat-title">채팅</span>
    <button onclick="document.getElementById('chat-modal').style.display='none'" style="background:none; border:none; color:white; cursor:pointer;">X</button>
  </div>
  <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; font-size:14px; background:#f9f9f9;"></div>
  <div style="padding:10px; border-top:1px solid #ddd; display:flex;">
    <input type="text" id="chat-input" style="flex:1; padding:5px; border:1px solid #ccc;">
    <button onclick="sendChatMessage()" style="margin-left:5px; background:#356fd4; color:white; border:none; padding:5px 10px;">전송</button>
  </div>
</div>
  <script src="app.js"></script>
</body>
</html>
