<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="[https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js](https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js)"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <h2>동호인 커뮤니티</h2>
    <div class="search-container" style="margin-bottom: 20px;">
      <input type="text" id="search-input" placeholder="제목으로 검색..." style="width: 100%; padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <button class="btn btn-outline category-btn active" data-category="공지게시판">공지게시판</button>
      <button class="btn btn-outline category-btn" data-category="질문게시판">질문게시판</button>
      <button class="btn btn-outline category-btn" data-category="수집/자랑게시판">수집/자랑게시판</button>
    </div>
    <div style="margin-bottom: 20px;">
      <button id="toggle-community-form-btn" class="btn btn-primary">글쓰기</button>
    </div>
    <div id="community-form-container" class="card" style="display: none; margin-bottom: 20px;">
      <h3>새 글 작성</h3>
      <form id="community-post-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
        <select id="post-category-select" style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
          <option value="공지게시판">공지게시판</option>
          <option value="질문게시판">질문게시판</option>
          <option value="수집/자랑게시판">수집/자랑게시판</option>
        </select>
        <input type="text" id="community-post-title" placeholder="제목을 입력하세요" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <div style="margin-bottom: 12px;">
  <label style="display:block; margin-bottom:5px; font-weight:bold;">사진 첨부 (최대 5장)</label>
  <input type="file" id="community-images" accept="image/*" multiple class="input-field">
  <div id="community-image-preview" class="image-preview-container"></div>
</div>
        <textarea id="community-post-content" placeholder="내용을 입력하세요" rows="4" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;"></textarea>
        <button type="submit" class="btn btn-primary" style="align-self: flex-start;">작성 완료</button>
      </form>
    </div>
    <div id="community-list"></div>
  </div>

  <!-- 우측 하단 동그란 채팅 버튼 -->
<button id="floating-chat-btn" onclick="openChatModal('admin')" 
  style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#356fd4; color:white; border:none; font-size:24px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:9999;">
  💬
</button>

<!-- 채팅창 모달 (기존과 동일) -->
<div id="chat-modal" style="display:none; position:fixed; bottom:90px; right:20px; width:300px; height:400px; background:white; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:9998; border-radius:8px; flex-direction:column;">
  <div style="padding:10px; background:#356fd4; color:white; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; border-radius:8px 8px 0 0;">
    <span id="chat-title">채팅</span>
    <button onclick="document.getElementById('chat-modal').style.display='none'" style="background:none; border:none; color:white; cursor:pointer;">X</button>
  </div>
  <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; font-size:14px; background:#f9f9f9;"></div>
  <div style="padding:10px; border-top:1px solid #ddd; display:flex;">
    <input type="text" id="chat-input" style="flex:1; padding:5px; border:1px solid #ccc;">
    <button onclick="sendChatMessage()" style="margin-left:5px; background:#356fd4; color:white; border:none; padding:5px 10px;">전송</button>
  </div>
</div>
  <script src="app.js"></script>
</body>
</html>
