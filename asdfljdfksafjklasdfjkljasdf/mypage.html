<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 600px;">
    <h2>마이페이지</h2>
    <p style="margin-bottom: 20px;">회원 정보를 확인하고 관리하세요.</p>

    <!-- 기본 회원 정보 -->
    <div class="card" style="margin-bottom: 20px;">
      <h3>기본 회원 정보</h3>
      <p style="margin-top: 10px;"><strong>닉네임(ID):</strong> <span id="my-nickname">로딩중...</span></p>
      <p style="margin-top: 5px;"><strong>권한:</strong> <span id="my-role">로딩중...</span></p>
    </div>

    <!-- 통합된 계좌 및 배송지 관리 폼 -->
    <div class="card" style="margin-bottom: 20px;">
      <h3>계좌 및 배송지 정보 관리</h3>
      <form id="profile-update-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
        <label style="font-size: 13px;">은행명</label>
        <input type="text" id="my-bank-name" placeholder="예: 국민은행" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        
        <label style="font-size: 13px;">예금주</label>
        <input type="text" id="my-account-holder" placeholder="예: 홍길동" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        
        <label style="font-size: 13px;">계좌번호</label>
        <input type="text" id="my-account-num" placeholder="예: 123-456-789012" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        
        <label style="font-size: 13px;">배송지 주소</label>
        <textarea id="my-address" placeholder="배송지 주소를 입력하세요" rows="3" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;"></textarea>
        
        <button type="submit" class="btn btn-primary" style="align-self: flex-start; margin-top: 5px;">정보 저장</button>
      </form>
    </div>
    
    <!-- 내 주문 내역 -->
    <div class="card" style="margin-bottom: 20px;">
      <h3>내 주문 내역</h3>
      <div id="my-orders-list">주문 내역을 불러오는 중...</div>
    </div>

    <!-- 내 상품 판매 현황 -->
    <div class="card" style="margin-bottom: 20px;">
      <h3>내 상품 판매 현황 (판매자용)</h3>
      <div id="my-sales-list">판매 내역을 불러오는 중...</div>
    </div>
    
    <!-- 관리자 전용 이동 버튼 (기본 숨김) -->
    <div id="admin-link-container" style="display: none; margin-bottom: 20px;">
      <a href="admin.html" class="btn btn-primary" style="background-color: #d9534f; width: 100%; text-align: center; display: block; padding: 12px; font-weight: bold;">관리자 페이지로 이동</a>
    </div>
  </div>

  <!-- 우측 하단 동그란 채팅 버튼 -->
<button id="floating-chat-btn" onclick="openChatModal('admin')" 
  style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#356fd4; color:white; border:none; font-size:24px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:9999;">
  💬
</button>

<!-- 채팅창 모달 (기존과 동일) -->
<div id="chat-modal" style="display:none; position:fixed; bottom:90px; right:20px; width:300px; height:400px; background:white; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:9998; border-radius:8px; flex-direction:column;">
  <div style="padding:10px; background:#356fd4; color:white; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; border-radius:8px 8px 0 0;">
    <span id="chat-title">채팅</span>
    <button onclick="document.getElementById('chat-modal').style.display='none'" style="background:none; border:none; color:white; cursor:pointer;">X</button>
  </div>
  <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; font-size:14px; background:#f9f9f9;"></div>
  <div style="padding:10px; border-top:1px solid #ddd; display:flex;">
    <input type="text" id="chat-input" style="flex:1; padding:5px; border:1px solid #ccc;">
    <button onclick="sendChatMessage()" style="margin-left:5px; background:#356fd4; color:white; border:none; padding:5px 10px;">전송</button>
  </div>
</div>
  <script src="app.js"></script>
</body>
</html>
