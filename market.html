<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베스벨샵 - 장터</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <a href="/" class="logo">
            <img src="assets/logo.png" alt="베스벨샵" class="site-logo">
        </a>
        <div class="nav-group">
            <a href="/market">장터</a>
            <a href="/community">커뮤니티</a>
            <a href="/mypage">마이페이지</a>
        </div>
    </header>

    <main class="container">
        <div style="max-width: 900px; margin: 20px auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
            <h2>📦 부품 판매 목록</h2>
            <a href="/market/write" class="btn-primary" style="padding: 8px 16px; background: var(--primary); color: #fff; border-radius: 6px; text-decoration: none;"><i class="fas fa-pen"></i> 상품 등록</a>
        </div>

        <!-- 3. 중고나라 스타일 목록 컨테이너 -->
        <div id="marketListContainer" class="market-list-container">
            <p style="text-align: center; color: var(--text-sub);">상품을 불러오는 중...</p>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadMarketItems();
        });

        async function loadMarketItems() {
            const container = document.getElementById('marketListContainer');
            try {
                const { data: items, error } = await db.from('market').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;
                if (!items || items.length === 0) {
                    container.innerHTML = '<p style="text-align:center; padding:40px; color:var(--text-sub);">등록된 상품이 없습니다.</p>';
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="joonggonara-card" onclick="location.href='/market/detail?id=${item.id}'">
                        <img src="${item.image_url || 'https://via.placeholder.com/110'}" alt="상품 이미지" class="market-thumb">
                        <div class="market-info">
                            <h3 class="market-title">${item.title}</h3>
                            <p class="market-price">${Number(item.price).toLocaleString()}원</p>
                            <div class="market-meta">
                                <span><i class="fas fa-user"></i> ${item.author}</span>
                                <span><i class="fas fa-clock"></i> ${new Date(item.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p style="text-align:center; color:red;">상품을 불러오는 데 실패했습니다.</p>';
            }
        }
    </script>
</body>
</html>
