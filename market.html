<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚙️ MARKET - 부품 장터</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>
</head>
<body>

    <header>
        <a class='logo' href='/' id="siteLogo">⚙️ <strong>MARKET</strong></a>
        
        <div class="nav-group" id="navGroup">
            <nav>
                <ul>
                    <li><a href='/'><i class="fas fa-home"></i> 홈</a></li>
                    <li><a href='market.html' class="active"><i class="fas fa-shopping-cart"></i> 장터</a></li>
                    <li><a href='community.html'><i class="fas fa-comments"></i> 커뮤니티</a></li>
                </ul>
            </nav>
            <div class="auth-container">
                <button class="auth-toggle-btn" id="authToggleBtn" onclick="toggleAuthDropdown()">
                    <i class="fas fa-user-circle"></i> 로그인 / 가입
                </button>
                <div class="auth-dropdown" id="authDropdown">
                    <div id="authFormArea"></div>
                </div>
            </div>
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
        <div class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2><i class="fas fa-bus"></i> 버스 부품 장터</h2>
                <p style="font-size: 0.85rem; color: var(--text-sub);">필요한 버스 부품을 안전하게 거래하세요.</p>
            </div>
            <div id="registerButtonArea"></div>
        </div>

        <!-- 상품 등록 폼 -->
        <section class="card glass-panel" id="productFormCard" style="display: none; margin-bottom: 20px;">
            <h3><i class="fas fa-plus-circle"></i> 새 부품 등록</h3>
            <input type="text" id="prodTitle" placeholder="상품명을 입력하세요" class="input-modern" style="margin-top: 10px;">
            <input type="number" id="prodPrice" placeholder="가격을 숫자로 입력하세요 (예: 5000)" class="input-modern">
            <input type="text" id="prodContact" placeholder="연락처 또는 이메일 (예: ansh110@naver.com)" class="input-modern">
            <textarea id="prodDesc" placeholder="상품 상세 설명 입력" class="input-modern" style="height: 100px; resize: none; margin-bottom: 10px;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-auth" onclick="uploadMarketItem()">등록 완료</button>
                <button class="btn-logout" onclick="toggleProductForm()" style="background:#555; color:#fff;">취소</button>
            </div>
        </section>

        <!-- 상품 목록 그리드 -->
        <section class="card glass-panel">
            <div id="marketItemList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;">
                <p>상품 목록을 불러오는 중...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ⚙️ MARKET. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const customTitle = localStorage.getItem('customSiteTitle');
            if (customTitle) {
                const logoElem = document.getElementById('siteLogo');
                if (logoElem) logoElem.innerHTML = customTitle;
            }

            fetchMarketItems();
            checkSellerPermission();
        });

        function checkSellerPermission() {
            const role = localStorage.getItem('currentUserRole');
            const area = document.getElementById('registerButtonArea');
            
            if (role === '판매자' || role === '관리자') {
                area.innerHTML = `<button class="btn-auth" style="padding: 8px 16px; font-size: 0.9rem;" onclick="toggleProductForm()"><i class="fas fa-pen"></i> 상품 등록</button>`;
            } else {
                area.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-sub);">* 상품 등록은 판매자/관리자만 가능합니다.</span>`;
            }
        }

        function toggleProductForm() {
            const card = document.getElementById('productFormCard');
            if (card) {
                card.style.display = card.style.display === 'none' ? 'block' : 'none';
            }
        }

        // 📦 기존 'market' 테이블에서 데이터 조회
        async function fetchMarketItems() {
            const listContainer = document.getElementById('marketItemList');
            try {
                const { data, error } = await db.from('market').select('*').order('id', { ascending: false });
                if (error) throw error;

                if (!data || data.length === 0) {
                    listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 30px; color:var(--text-sub);">등록된 부품이 없습니다.</p>`;
                    return;
                }

                listContainer.innerHTML = data.map(item => `
                    <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                                <h4 style="font-size: 1.1rem; margin:0;">${item.title}</h4>
                                <span style="font-weight: bold; color: var(--accent-color, #2ed573);">${Number(item.price).toLocaleString()}원</span>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px;"><i class="fas fa-envelope"></i> 연락처: ${item.contact || '미입력'}</p>
                            <p style="font-size: 0.88rem; color: var(--text-sub); margin-bottom: 12px; white-space: pre-wrap; word-break: break-all;">${item.description}</p>
                        </div>
                        <div style="border-top: 1px solid var(--border-color); padding-top: 10px; display:flex; justify-content:space-between; align-items:center; font-size: 0.8rem; color: var(--text-sub);">
                            <span>판매자: <strong>${item.author}</strong></span>
                            <button class="btn-auth" style="padding: 4px 10px; font-size: 0.8rem; width: auto;" onclick="buyItem('${item.title}', '${item.price}', '${item.author}', '${item.contact}')">구매 신청</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">상품을 불러오는 중 오류가 발생했습니다.</p>`;
            }
        }

        // ✍️ 기존 'market' 테이블에 데이터 인서트 (author, contact 컬럼 매칭)
        async function uploadMarketItem() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return alert('로그인 후 이용해주세요.');

            const title = document.getElementById('prodTitle').value.trim();
            const priceVal = document.getElementById('prodPrice').value.trim();
            const contact = document.getElementById('prodContact').value.trim();
            const description = document.getElementById('prodDesc').value.trim();

            if (!title || !priceVal || !description) return alert('상품명, 가격, 설명은 필수 입력입니다.');

            const { error } = await db.from('market').insert([{
                title,
                price: parseInt(priceVal) || 0,
                contact,
                description,
                author: currentUser
            }]);

            if (error) {
                alert('등록 실패: ' + error.message);
            } else {
                alert('부품이 성공적으로 등록되었습니다!');
                document.getElementById('prodTitle').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodContact').value = '';
                document.getElementById('prodDesc').value = '';
                toggleProductForm();
                fetchMarketItems();
            }
        }

        // 🛒 구매 신청 시 Supabase orders 테이블에 기록
        async function buyItem(title, price, seller, contact) {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return alert('구매 신청을 하시려면 로그인이 필요합니다.');

            if (!confirm(`[${title}] (${Number(price).toLocaleString()}원)\n판매자: ${seller}님께 구매를 신청하시겠습니까?`)) return;

            const { error } = await db.from('orders').insert([{
                item_title: title,
                price: parseInt(price) || 0,
                buyer: currentUser,
                seller: seller,
                contact: contact || '미입력'
            }]);

            if (error) {
                alert('구매 신청 실패: ' + error.message);
            } else {
                alert(`[${title}] 구매 신청이 완료되었습니다!\n판매자(${seller})가 확인 후 연락을 드릴 것입니다.`);
            }
        }
    </script>
</body>
</html>
