<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚙️ MARKET - 장터</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>
</head>
<body>

    <header>
        <a class='logo' href='/' id="siteLogo">⚙️ <strong>MARKET</strong></a>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <div class="nav-group" id="navGroup">
            <nav>
                <ul>
                    <li><a href='/'><i class="fas fa-home"></i> 홈</a></li>
                    <li><a href='market.html' class="active"><i class="fas fa-shopping-cart"></i> 장터</a></li>
                    <li><a href='community.html'><i class="fas fa-comments"></i> 커뮤니티</a></li>
                </ul>
            </nav>
            <div id="authContainer">
                <button onclick="toggleAuthDropdown()" id="authToggleBtn" class="user-badge">
                    <i class="fas fa-user-circle"></i> 로그인 / 가입
                </button>
                <div id="authDropdown" class="auth-dropdown"><div id="authFormArea"></div></div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- 📝 상단: 검색 및 글쓰기 권한 영역 -->
        <section class="card glass-panel search-section">
            <div class="search-bar-group">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="상품 검색..." class="input-modern" onkeyup="filterItems()">
                </div>
                <div id="registerButtonArea">
                    <!-- JS에서 권한 체크 후 글쓰기 버튼 렌더링 -->
                </div>
            </div>
        </section>

        <!-- 📦 목록 표시 영역 -->
        <section class="card glass-panel">
            <h2><i class="fas fa-box-open"></i> 판매 목록</h2>
            <div id="marketItemList" class="post-list">
                <p style="text-align:center;">상품을 불러오는 중...</p>
            </div>
        </section>
    </main>

    <!-- 📝 상품 등록/수정 모달 -->
    <div id="productFormModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="formModalTitle"><i class="fas fa-plus-circle"></i> 상품 등록</h3>
            </div>
            <form id="productForm" onsubmit="submitMarketItem(event)">
                <input type="text" id="prodTitle" placeholder="상품명" class="input-modern" required>
                <input type="number" id="prodPrice" placeholder="가격 (원)" class="input-modern" required>
                
                <label style="font-size:0.8rem; color:var(--text-sub); margin-top:10px; display:block;">상품 사진 (선택)</label>
                <input type="file" id="prodImage" accept="image/*" class="input-modern" style="padding:8px; margin-bottom: 10px;">
                
                <input type="text" id="prodContact" placeholder="연락처 (오픈채팅/전화번호 등)" class="input-modern" required>
                <textarea id="prodDesc" rows="5" placeholder="상품 상세 설명" class="input-modern" required></textarea>
                
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeProductForm()">취소</button>
                    <button type="submit" class="btn-auth">완료</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let allItems = [];
        let editingItemId = null; // 수정 모드 판별 변수

        window.addEventListener('DOMContentLoaded', () => {
            checkSellerPermission();
            fetchMarketItems();
        });

        // 1. 판매 권한 체크 (관리진, 특수회원, 판매자만 등록 가능)
        function checkSellerPermission() {
            const role = localStorage.getItem('currentUserRole') || '일반회원';
            const area = document.getElementById('registerButtonArea');
            
            if (['관리진', '특수회원', '판매자'].includes(role)) {
                area.innerHTML = `<button class="btn-primary-large btn-write" onclick="openProductForm()"><i class="fas fa-pen"></i> 상품 등록</button>`;
            } else {
                area.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-sub);">* 상품 등록은 판매자 이상만 가능합니다.</span>`;
            }
        }

        // 2. 폼 열기 (새 글 or 수정)
        function openProductForm(id = null) {
            const modal = document.getElementById('productFormModal');
            modal.style.display = 'flex';
            
            if (id) {
                const item = allItems.find(i => i.id === id);
                editingItemId = item.id;
                document.getElementById('prodTitle').value = item.title;
                document.getElementById('prodPrice').value = item.price;
                document.getElementById('prodContact').value = item.contact;
                document.getElementById('prodDesc').value = item.description;
                document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-edit"></i> 상품 수정';
            } else {
                editingItemId = null;
                document.getElementById('productForm').reset();
                document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> 새 상품 등록';
            }
        }

        function closeProductForm() {
            document.getElementById('productFormModal').style.display = 'none';
            editingItemId = null;
        }

        // 3. 상품 목록 불러오기 및 렌더링
        async function fetchMarketItems() {
            const listContainer = document.getElementById('marketItemList');
            const currentUser = localStorage.getItem('currentUser');
            const currentRole = localStorage.getItem('currentUserRole');

            try {
                const { data, error } = await db.from('market').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allItems = data;

                if(data.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center;">등록된 상품이 없습니다.</p>';
                    return;
                }

                listContainer.innerHTML = data.map(item => {
                    // 본인 글이거나 관리진이면 수정/삭제 버튼 렌더링
                    const canEdit = (currentUser === item.author || currentRole === '관리진');
                    const adminButtons = canEdit ? `
                        <div style="margin-top: 10px; display:flex; gap:10px;">
                            <button onclick='openProductForm(${item.id})' class="btn-auth" style="padding: 5px 10px; font-size: 0.8rem;">수정</button>
                            <button onclick="deleteMarketItem(${item.id})" class="btn-logout" style="padding: 5px 10px; font-size: 0.8rem;">삭제</button>
                        </div>
                    ` : '';

                    return `
                        <div class="post-item" style="display:flex; flex-direction:column; gap:10px;">
                            ${item.image_url ? `<img src="${item.image_url}" style="width: 100%; height: 200px; object-fit: cover; border-radius:8px;">` : ''}
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <h4>${item.title}</h4>
                                <strong style="color:var(--primary-color);">${Number(item.price).toLocaleString()}원</strong>
                            </div>
                            <p style="font-size:0.9rem; color:var(--text-sub);">판매자: ${item.author} | 연락처: ${item.contact}</p>
                            <p style="white-space: pre-wrap;">${item.description}</p>
                            ${adminButtons}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '<p>데이터를 불러오는데 실패했습니다.</p>';
            }
        }

        // 4. 상품 등록 / 수정 처리 (이미지 업로드 포함)
        async function submitMarketItem(e) {
            e.preventDefault();
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return alert('로그인 후 이용하세요.');

            const title = document.getElementById('prodTitle').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const contact = document.getElementById('prodContact').value.trim();
            const description = document.getElementById('prodDesc').value.trim();
            const imageInput = document.getElementById('prodImage');

            let imageUrl = '';
            
            // 사진이 선택되었다면 업로드
            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                const fileName = `market_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                const { error: uploadError } = await db.storage.from('images').upload(fileName, file);
                
                if (uploadError) return alert('이미지 업로드 실패: ' + uploadError.message);
                imageUrl = db.storage.from('images').getPublicUrl(fileName).data.publicUrl;
            }

            let query;
            if (editingItemId) {
                // 기존 데이터 유지 로직 (새 이미지가 없으면 URL 업데이트 안 함)
                const updateData = { title, price, contact, description };
                if (imageUrl) updateData.image_url = imageUrl; 
                query = db.from('market').update(updateData).eq('id', editingItemId);
            } else {
                query = db.from('market').insert([{ title, price, contact, description, author: currentUser, image_url: imageUrl }]);
            }

            const { error } = await query;
            if (error) alert('처리 실패: ' + error.message);
            else {
                alert(editingItemId ? '수정되었습니다.' : '등록되었습니다.');
                closeProductForm();
                fetchMarketItems();
            }
        }

        // 5. 상품 삭제
        async function deleteMarketItem(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const { error } = await db.from('market').delete().eq('id', id);
            if (error) alert('삭제 실패: ' + error.message);
            else {
                alert('삭제되었습니다.');
                fetchMarketItems();
            }
        }

        // 검색 기능
        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('#marketItemList .post-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
