<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Bus Bell Shop - 장터</title>
</head>
<body>
    <header>
        <div class="logo">Bus Bell Shop</div>
    </header>
    <div class="content">
        <h1>중고 장터</h1>
        
        <!-- 검색 기능 삭제됨 -->

        <button id="btnOpenSell" onclick="toggleSellForm()">상품 등록하기</button>

        <div id="sellForm" class="hidden">
            <h3>상품 등록 (에스크로 방식)</h3>
            <p>판매 금액의 2%는 수수료로 차감됩니다.</p>
            <p><strong>결제 계좌: 하나은행 154-910580-98807 (안수현)</strong></p>
            <input type="text" placeholder="상품명"><br>
            <input type="number" placeholder="판매가"><br>
            <button onclick="submitProduct()">등록하기</button>
        </div>

        <div id="productList">
            <h3>판매글 목록</h3>
            <!-- 기본적으로 판매글을 여기서 불러와 보여줍니다 -->
            <p>등록된 상품이 없습니다.</p>
        </div>
    </div>
    <script>
        function toggleSellForm() {
            document.getElementById('sellForm').classList.toggle('hidden');
        }
        function submitProduct() { alert("상품이 등록되었습니다."); }
    </script>
</body>
</html>
