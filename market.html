<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중고마켓 - 버스벨샵</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="icon.png" alt="버스벨샵 로고"></a>
    </div>
    <div class="search-gradient-wrap">
      <div class="search-container">
        <input type="text" placeholder="부품명, 내용 검색">
      </div>
    </div>
    <div class="header-actions">
      <button onclick="toggleTheme()">테마 변경</button>
      <a href="mypage.html">마이페이지</a>
    </div>
  </header>

  <nav class="sub-nav">
    <a href="index.html">홈</a>
    <a href="market.html" class="active">중고마켓</a>
    <a href="community.html">커뮤니티</a>
    <a href="admin.html" id="admin-nav" style="display:none;">관리자</a>
  </nav>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div class="section-title" style="margin-bottom: 0;">버스 부품 마켓</div>
      <button class="btn-primary" onclick="alert('상품 등록 기능 연동 예정')">판매글 등록</button>
    </div>
    <div class="content-box" id="market-list">
      <p>Supabase `market` 테이블 연동 데이터 출력 영역입니다.</p>
    </div>
  </main>

  <script>
    const user = getCurrentUser();
    if (user && user.role === '관리자') {
      document.getElementById('admin-nav').style.display = 'block';
    }
  </script>
</body>
</html>
