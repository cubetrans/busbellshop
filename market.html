<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장터 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <h2>중고 장터</h2>
    <div class="search-container" style="margin-bottom: 20px;">
      <input type="text" id="search-input" placeholder="제목으로 검색..." style="width: 100%; padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
    </div>
    <div style="margin-bottom: 20px;">
      <button id="toggle-market-form-btn" class="btn btn-primary">상품 등록하기</button>
    </div>
    <div id="market-form-container" class="card" style="display: none; margin-bottom: 20px;">
      <h3>상품 등록</h3>
      <form id="market-post-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="post-title" placeholder="상품명을 입력하세요" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <input type="text" id="post-price" placeholder="가격을 입력하세요" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <textarea id="post-content" placeholder="상품 설명을 입력하세요" rows="4" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;"></textarea>
        <button type="submit" class="btn btn-primary" style="align-self: flex-start;">등록 완료</button>
      </form>
    </div>
    <div id="market-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
