<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 600px;">
    <h2>마이페이지</h2>
    <div class="card" style="margin-bottom: 20px;">
      <h3>기본 회원 정보</h3>
      <p><strong>닉네임:</strong> <span id="my-nickname">로딩중...</span></p>
    </div>
    <div class="card" style="margin-bottom: 20px;">
      <h3>계좌 및 배송지 정보 관리</h3>
      <form id="profile-update-form" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="my-bank-name" placeholder="은행명" required style="padding: 10px;">
        <input type="text" id="my-account-holder" placeholder="예금주" required style="padding: 10px;">
        <input type="text" id="my-account-num" placeholder="계좌번호" required style="padding: 10px;">
        <textarea id="my-address" placeholder="주소" rows="3" required style="padding: 10px;"></textarea>
        <button type="submit" class="btn btn-primary">정보 저장</button>
      </form>
    </div>
    <div class="card" style="margin-bottom: 20px;">
      <h3>내 주문 내역</h3>
      <div id="my-orders-list"></div>
    </div>
    <div class="card" style="margin-bottom: 20px;">
      <h3>내 상품 판매 현황</h3>
      <div id="my-sales-list"></div>
    </div>
    <div id="admin-link-container" style="display: none; margin-bottom: 20px;">
      <a href="admin.html" class="btn btn-primary" style="background-color: #d9534f; width: 100%; text-align: center; display: block; padding: 12px;">관리자 페이지로 이동</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
