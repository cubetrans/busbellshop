<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 버스벨샵</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="icon.png" alt="버스벨샵 로고"></a>
    </div>
    <div class="header-actions" id="auth-menu-area">
      <button onclick="toggleTheme()">테마 변경</button>
      <a href="index.html">홈으로</a>
    </div>
  </header>

  <main style="max-width: 600px;">
    <div class="section-title">마이페이지 (회원 정보 관리)</div>
    <div class="content-box">
      <p id="user-profile-summary" style="font-weight: bold; margin-bottom: 15px;"></p>
      
      <label>새 비밀번호 변경</label>
      <input type="password" id="new-pw" placeholder="변경할 비밀번호 입력">

      <label>정산 은행명</label>
      <input type="text" id="bank-name" placeholder="예: 하나은행">

      <label>계좌번호</label>
      <input type="text" id="bank-number" placeholder="계좌번호 입력">

      <label>예금주</label>
      <input type="text" id="bank-holder" placeholder="예금주 성명">

      <button class="btn-primary" style="margin-top: 10px;" onclick="updateMyInfo()">정보 수정하기</button>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getLoggedInUser();
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('user-profile-summary').innerText = `접속 계정: ${user.nickname} (회원 등급: ${user.role})`;
      document.getElementById('new-pw').value = user.password || '';
      document.getElementById('bank-name').value = user.bank_name || '';
      document.getElementById('bank-number').value = user.account_number || '';
      document.getElementById('bank-holder').value = user.account_holder || '';
    });

    async function updateMyInfo() {
      const user = getLoggedInUser();
      const password = document.getElementById('new-pw').value.trim();
      const bank_name = document.getElementById('bank-name').value.trim();
      const account_number = document.getElementById('bank-number').value.trim();
      const account_holder = document.getElementById('bank-holder').value.trim();

      if (!password) {
        alert('비밀번호는 공백일 수 없습니다.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('users')
        .update({ password, bank_name, account_number, account_holder })
        .eq('nickname', user.nickname)
        .select()
        .single();

      if (error) {
        alert('정보 수정 중 오류가 발생했습니다.');
      } else {
        setLoggedInUser(data);
        alert('회원 정보가 성공적으로 수정되었습니다.');
        window.location.reload();
      }
    }
  </script>
</body>
</html>
