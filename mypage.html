<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <header>
  <div class="logo">
    <a href="index.html"><img src="icon.png" alt="로고"></a>
  </div>
  
  <div class="search-gradient-wrap">
    <div class="search-container">
      <input type="text" id="search-input" placeholder="검색...">
    </div>
  </div>

  <!-- 이 영역이 자바스크립트에 의해 동적으로 채워집니다 -->
  <div class="header-actions" id="auth-menu-area"></div>
</header>

<nav class="sub-nav" id="sub-nav">
  <a href="index.html">홈</a>
  <a href="market.html">중고마켓</a>
  <a href="community.html">커뮤니티</a>
  <a href="mypage.html">마이페이지</a>
  <a href="admin.html" id="admin-nav" style="display:none;">관리자</a>
</nav>
<body>
  <main>
    <h2>내 주문 내역</h2>
    <div id="my-orders" class="content-box"></div>
  </main>

  <script>
    async function loadMyOrders() {
      const user = getLoggedInUser();
      if(!user) { alert('로그인 필요'); return; }
      
      const { data } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('buyer_nickname', user.nickname);

      const area = document.getElementById('my-orders');
      area.innerHTML = data.map(o => `
        <div style="border-bottom:1px solid #ccc; padding:10px;">
          <p>상품: ${o.item_title} | 가격: ${o.amount.toLocaleString()}원</p>
          <p>상태: <strong>${o.status}</strong></p>
        </div>
      `).join('');
    }
    loadMyOrders();
  </script>
</body>
</html>
