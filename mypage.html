<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline auth-action">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html">마이페이지</a></li>
        <li><a href="#" class="logout-btn">로그아웃</a></li>
      </ul>
    </div>
  </header>
  
  <div class="container" style="max-width: 600px;">
    <h2>마이페이지</h2>
    <p style="margin-bottom: 20px;">회원 정보를 확인하고 관리하세요.</p>

    <div class="card" style="margin-bottom: 20px;">
      <h3>기본 회원 정보</h3>
      <p style="margin-top: 10px;"><strong>닉네임(ID):</strong> <span id="my-nickname">로딩중...</span></p>
      <p style="margin-top: 5px;"><strong>권한:</strong> <span id="my-role">로딩중...</span></p>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <h3>계좌번호 관리</h3>
      <form id="account-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="account-input" placeholder="계좌번호를 입력하세요 (예: 카카오뱅크 123-456-...)" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <button type="submit" class="btn btn-primary" style="align-self: flex-start;">계좌번호 저장</button>
      </form>
    </div>

    <!-- 마이페이지 계좌/배송지 관리 부분 -->
<div class="card">
  <h3>개인정보 및 배송 관리</h3>
  <form id="profile-update-form" style="display:flex; flex-direction:column; gap:10px;">
    <input type="text" id="my-bank-name" placeholder="은행명 (예: 국민은행)">
    <input type="text" id="my-account-num" placeholder="계좌번호">
    <textarea id="my-address" placeholder="배송지 주소"></textarea>
    <button type="submit" class="btn btn-primary">정보 저장</button>
  </form>
</div>

<!-- 자신의 주문 내역 -->
<div class="card">
  <h3>내 주문 내역</h3>
  <div id="my-orders-list"></div>
</div>
    
    <!-- 관리자 전용 이동 버튼 (기본 숨김) -->
    <div id="admin-link-container" style="display: none;">
      <a href="admin.html" class="btn btn-primary" style="background-color: #d9534f; width: 100%; text-align: center; display: block; padding: 12px;">관리자 페이지로 이동</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
