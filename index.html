<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베스벨샵 - 하차벨 전문 장터</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <a href="/" class="logo">
            <!-- 1. 이미지 로고 적용 (assets/logo.png 경로에 업로드 필요) -->
            <img src="assets/logo.png" alt="베스벨샵" class="site-logo">
        </a>
        <div class="nav-group">
            <a href="/market">장터</a>
            <a href="/community">커뮤니티</a>
            <a href="/mypage">마이페이지</a>
            <button id="themeBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <!-- 4. Admin에서 관리하는 상단 배너 영역 -->
    <div class="top-banner-container">
        <img id="mainBannerImage" src="assets/default_banner.png" alt="베스벨샵 이벤트 배너">
    </div>

    <main class="container" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <section class="card glass-panel" style="text-align: center; padding: 3rem 1rem;">
            <h2>🔔 베스벨샵에 오신 것을 환영합니다!</h2>
            <p style="color: var(--text-sub);">국내 최고의 버스 하차벨 및 부품 거래 커뮤니티</p>
            <a href="/market" class="btn-primary" style="display: inline-block; margin-top: 15px; padding: 10px 20px; background: var(--primary); color: #fff; border-radius: 6px; text-decoration: none;">장터 구경하기</a>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // 페이지 로드 시 Admin이 설정한 배너 이미지 불러오기
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data } = await db.from('settings').select('*').eq('key', 'top_banner_url').maybeSingle();
                if (data && data.value) {
                    document.getElementById('mainBannerImage').src = data.value;
                }
            } catch(e) {
                console.log("배너 로드 기본값 유지");
            }
        });
    </script>

    <!-- 2. 채널톡(Channel Talk) 고객센터 연동 스크립트 -->
    <script>
      (function() {
        var w = window;
        if (w.ChannelIO) { return (window.console.error || window.console.log || function(){})('ChannelIO script included twice.'); }
        var ch = function() { ch.c(arguments); };
        ch.q = [];
        ch.c = function(args) { ch.q.push(args); };
        w.ChannelIO = ch;
        function l() {
          if (w.ChannelIOInitialized) { return; }
          w.ChannelIOInitialized = true;
          var s = document.createElement('script');
          s.type = 'text/javascript'; s.async = true;
          s.src = 'https://cdn.channel.io/plugin/ch-plugin-web.js';
          s.charset = 'UTF-8';
          var x = document.getElementsByTagName('script')[0];
          x.parentNode.insertBefore(s, x);
        }
        if (document.readyState === 'complete') { l(); }
        else if (window.attachEvent) { window.attachEvent('onload', l); }
        else { window.addEventListener('DOMContentLoaded', l, false); window.addEventListener('load', l, false); }
      })();
      
      ChannelIO('boot', {
        "pluginKey": "여기에_채널톡_플러그인키를_입력하세요" // 채널톡 관리자센터에서 발급받은 키 입력
      });
    </script>
</body>
</html>
