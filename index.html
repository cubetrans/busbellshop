<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버스벨샵 (Bus Bell Shop)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline auth-action">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html">마이페이지</a></li>

      </ul>
    </div>
  </header>

  <div class="container">
    <div class="banner">
      <img src="icon.png" alt="Bus Bell Shop Banner" onerror="this.src='https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1200&q=80'">
      <div class="banner-content">
        <h1>버스벨샵</h1>
        <p>대한민국 최고의 버스 부품 및 교통 동호인 커뮤니티 쇼핑몰</p>
      </div>
    </div>

    <div class="card">
      <h2>환영합니다!</h2>
      <p style="margin-top: 10px;">버스 하차벨, 도어스위치, 안내방송기 등 다양한 교통 부품을 만나보세요. 장터와 커뮤니티를 통해 동호인들과 소통할 수 있습니다.</p>
    </div>
  </div>

  <script src="app.js"></script>
