<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>버스벨샵</title>
</head>
<body>

    <!-- 1. 상단 헤더 영역 (메뉴) -->
    <header>
        <nav>
            <ul>
                <!-- 다른 HTML 파일로 이동 -->
                <li><a href="index.html">홈</a></li>
                <li><a href="market.html">소개</a></li>
                <!-- 현재 페이지 안에서 특정 위치(id)로 이동 -->
                <li><a href="#testsection">섹션이동텍스트</a></li>
            </ul>
        </nav>

            <p>이곳은 메인 콘텐츠가 들어가는 자리입니다.</p>
        </section>

        <!-- 이동할 목적지 (id 지정) -->
        <section id="testsection">
            <h2>테스트 섹션</h2>
            <p>테스트 내용</p>
        </section>

</html>
