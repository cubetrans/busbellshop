<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 재정비 안내</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .notice-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            font-size: 22px;
            color: #d9534f;
            margin-bottom: 20px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }
        .highlight {
            color: #0275d8;
            font-weight: bold;
        }
        .footer {
            margin-top: 25px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="notice-card">
        <h1>사이트 서비스 잠정 중단 안내</h1>
        <p>먼저, 저희 서비스를 아껴주신 이용자 여러분께 실망을 끼쳐 드려 진심으로 고개 숙여 사과드립니다.</p>
        <p>본 사이트는 대한민국 관련 법률(전자금융거래법, 전자상거래법 등) 준수 여부 및 운영 규정의 면밀한 검토를 위해 모든 서비스 운영을 잠정 중단하게 되었습니다.</p>
        <p>이에 따라 사이트 내 모든 거래 및 관련 기능은 잠시 중단됩니다.</p>
        <p>이번 일을 계기로 더욱 철저히 보완하여, <span class="highlight">더 안전하고 알찬 모습으로 빠르게 돌아오겠습니다.</span></p>
        <div class="footer">
            버스벨샵 관리진 일동
        </div>
    </div>

</body>
</html>
