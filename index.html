<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>busbell - 내 근처 P2P 직거래</title>
    <style>
        /* 기본 배경 및 글꼴 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        /* 메인 컨테이너 (글래스모피즘 메인 패널) */
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* 헤더 / 로고 */
        header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.6));
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fde047, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* 메인 공지 타이틀 */
        .notice-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* 검색 영역 및 글쓰기 버튼 */
        .search-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem 1.2rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        .btn {
            padding: 0.75rem 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .action-row {
            margin-bottom: 1.5rem;
        }

        .btn-write {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3));
            border: 1px solid rgba(236, 72, 153, 0.4);
        }

        .btn-write:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(236, 72, 153, 0.5));
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        /* 카테고리 태그 목록 */
        .category-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .cat-btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* 상품 카드 영역 (글래스 카드) */
        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(168, 85, 247, 0.2);
        }

        .product-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 로고 -->
        <header>
            <span class="logo-icon">🔔</span>
            <span class="logo-text">busbell</span>
        </header>

        <!-- 타이틀 -->
        <h1 class="notice-title">우리 사이트는 공사중입니다 절대로 이용하지 마세요</h1>

        <!-- 검색 영역 -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="물품명, 카테고리 등 검색">
            <button class="btn">검색</button>
        </div>

        <!-- 글쓰기 버튼 -->
        <div class="action-row">
            <button class="btn btn-write">+ 글쓰기</button>
        </div>

        <!-- 카테고리 버튼 -->
        <div class="category-group">
            <button class="cat-btn active">전체</button>
            <button class="cat-btn">전자기기</button>
            <button class="cat-btn">의류/잡화</button>
            <button class="cat-btn">도서/티켓</button>
            <button class="cat-btn">취미/용품</button>
            <button class="cat-btn">기타</button>
        </div>

        <!-- 기존 상품 데이터 카드 -->
        <div class="product-card">
            <!-- 원래 올리신 이미지 및 텍스트 데이터 유지 -->
            <img class="product-image" src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=1000&auto=format&fit=crop" alt="아이패드 에어 4세대">
            <div class="product-title">아이패드 에어 4세대 64GB 쌈무그린 (상태 양호)</div>
            <div class="product-price">450,000원</div>
        </div>
    </div>

</body>
</html>
