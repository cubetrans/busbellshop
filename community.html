<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버스벨 샵 - 커뮤니티</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .logo img { height: 40px; display: block; }
        nav a { margin-left: 20px; text-decoration: none; color: #555; font-weight: bold; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 8px 15px; border-radius: 4px; color: #555; }
        .tab-btn.active { background: #007bff; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .post-list { background: white; border-radius: 8px; border: 1px solid #ddd; overflow: hidden; }
        .post-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .post-item:last-child { border-bottom: none; }
        .post-title { font-weight: bold; font-size: 16px; }
        .post-info { font-size: 12px; color: #777; margin-top: 5px; }
        /* 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <nav>
            <a href="index.html">홈</a>
            <a href="market.html">장터</a>
            <a href="community.html">커뮤니티</a>
        </nav>
    </header>

    <div class="container">
        <!-- 게시판 탭 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchCategory('notice')">공지게시판</button>
            <button class="tab-btn" onclick="switchCategory('qna')">질문게시판</button>
            <button class="tab-btn" onclick="switchCategory('showcase')">수집/자랑게시판</button>
        </div>

        <div class="top-bar">
            <h2 id="boardTitle">공지게시판</h2>
            <button class="btn" onclick="openWriteModal()">글쓰기</button>
        </div>

        <!-- 게시글 목록 -->
        <div id="post-list" class="post-list">
            <p style="padding: 20px; text-align: center;">게시글을 불러오는 중...</p>
        </div>
    </div>

    <!-- 글쓰기 모달 -->
    <div id="writeModal" class="modal">
        <div class="modal-content">
            <h3>글 작성하기</h3>
            <select id="wCategory">
                <option value="notice">공지게시판 (관리자 전용)</option>
                <option value="qna">질문게시판</option>
                <option value="showcase">수집/자랑게시판</option>
            </select>
            <input type="text" id="wTitle" placeholder="제목">
            <input type="text" id="wAuthor" placeholder="작성자명 (또는 관리자 여부)">
            <textarea id="wContent" placeholder="내용을 입력하세요" rows="5"></textarea>
            <button class="btn" style="width: 100%;" onclick="createPost()">등록</button>
            <button class="btn" style="width: 100%; background: #6c757d; margin-top: 5px;" onclick="closeWriteModal()">취소</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ipgzhipiebcnkfqzufgm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZ3poaXBpZWJjbmtmcXp1ZmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODMxMTgsImV4cCI6MjEwMTU1OTExOH0.byzqUDMvoAIbybPYbyKsR6KoPnpLPs0jsdawAnW0Eww';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'notice';

        document.addEventListener("DOMContentLoaded", () => {
            fetchPosts();
        });

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const titles = { notice: '공지게시판', qna: '질문게시판', showcase: '수집/자랑게시판' };
            document.getElementById('boardTitle').innerText = titles[category];
            fetchPosts();
        }

        async function fetchPosts() {
            const listEl = document.getElementById('post-list');
            const { data, error } = await supabaseClient
                .from('community_posts')
                .select('*')
                .eq('category', currentCategory)
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = '<p style="padding: 20px;">게시글을 불러오지 못했습니다.</p>';
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = '<p style="padding: 20px; text-align: center; color: #777;">작성된 글이 없습니다.</p>';
                return;
            }

            listEl.innerHTML = data.map(post => `
                <div class="post-item">
                    <div>
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-info">작성자: ${escapeHtml(post.author)} | 작성일: ${new Date(post.created_at).toLocaleDateString()}</div>
                    </div>
                    <div>
                        <button class="btn" style="background: #dc3545; padding: 5px 10px; font-size: 12px;" onclick="deletePost('${post.id}', '${post.author}')">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function openWriteModal() { document.getElementById('writeModal').style.display = 'flex'; }
        function closeWriteModal() { document.getElementById('writeModal').style.display = 'none'; }

        async function createPost() {
            const category = document.getElementById('wCategory').value;
            const title = document.getElementById('wTitle').value;
            const author = document.getElementById('wAuthor').value;
            const content = document.getElementById('wContent').value;

            if (!title || !author || !content) {
                alert('모든 항목을 입력해주세요.');
                return;
            }

            // 공지게시판 권한 검증 예시 (실제 관리자 검증 로직에 맞게 조정 가능)
            if (category === 'notice' && !author.includes('관리자')) {
                alert('공지게시판은 관리자만 작성할 수 있습니다.');
                return;
            }

            const { error } = await supabaseClient.from('community_posts').insert([{ category, title, author, content }]);
            if (error) {
                alert('글 작성 실패: ' + error.message);
            } else {
                alert('글이 등록되었습니다.');
                closeWriteModal();
                fetchPosts();
            }
        }

        async function deletePost(id, author) {
            const passwordOrAuth = prompt('작성자 본인 또는 관리진일 경우 삭제 권한이 있습니다. 확인용 이름을 입력하세요:');
            if (passwordOrAuth !== author && !passwordOrAuth.includes('관리자')) {
                alert('삭제 권한이 없습니다.');
                return;
            }

            const { error } = await supabaseClient.from('community_posts').delete().eq('id', id);
            if (error) {
                alert('삭제 실패: ' + error.message);
            } else {
                alert('게시글이 삭제되었습니다.');
                fetchPosts();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
