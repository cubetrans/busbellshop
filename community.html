<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>커뮤니티</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
            const savedTitle = localStorage.getItem('siteTitle') || 'MARKET';
            document.title = savedTitle + ' - 커뮤니티';
            const logoEl = document.getElementById('siteLogo');
            if (logoEl) logoEl.innerHTML = `⚙️ <strong>${savedTitle}</strong>`;
        });
    </script>
</head>
<body>
    <header>
        <a class='logo' href='/' id="siteLogo">⚙️ <strong>MARKET</strong></a>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <div class="nav-group" id="navGroup">
            <nav>
                <ul>
                    <li><a href='/'><i class="fas fa-home"></i> 홈</a></li>
                    <li><a href='market.html'><i class="fas fa-shopping-cart"></i> 장터</a></li>
                    <li><a href='community.html' class="active"><i class="fas fa-comments"></i> 커뮤니티</a></li>
                </ul>
            </nav>
            <div id="authContainer">
                <button onclick="toggleAuthDropdown()" id="authToggleBtn" class="user-badge">
                    <i class="fas fa-user-circle"></i> 로그인 / 가입
                </button>
                <div id="authDropdown" class="auth-dropdown"><div id="authFormArea"></div></div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card glass-panel search-section">
            <div class="search-bar-group">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="게시글 검색..." class="input-modern" onkeyup="filterPosts()">
                </div>
                <button class="btn-primary-large btn-write" onclick="openWriteModal()"><i class="fas fa-pen"></i> 글쓰기</button>
            </div>
        </section>

        <section class="card glass-panel">
            <div id="postList" class="post-list">
                <p style="text-align:center;">게시글을 불러오는 중...</p>
            </div>
        </section>
    </main>

    <!-- 게시글 작성/수정 모달 -->
    <div id="writeModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="writeModalTitle"><i class="fas fa-pen-nib"></i> 새 게시글 작성</h3>
            </div>
            <form id="postForm" onsubmit="submitPost(event)">
                <select id="postCategory" class="input-modern" required></select>
                <input type="text" id="postTitle" placeholder="제목" class="input-modern" required>
                
                <label style="font-size:0.8rem; color:var(--text-sub); margin-top:10px; display:block;">사진 첨부 (선택)</label>
                <input type="file" id="postImage" accept="image/*" class="input-modern" style="padding:8px; margin-bottom: 5px;">
                <div id="deleteImgArea" style="display:none; margin-bottom:10px;">
                    <label style="font-size:0.85rem; color:#ff4d4f; cursor:pointer;">
                        <input type="checkbox" id="deleteExistingImg"> 🗑️ 기존 등록된 사진 삭제
                    </label>
                </div>
                
                <textarea id="postContent" rows="6" placeholder="내용" class="input-modern" required></textarea>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeWriteModal()">취소</button>
                    <button type="submit" class="btn-auth">작성 완료</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 상세 보기 모달 -->
    <div id="detailModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" id="detailContent"></div>
    </div>

    <script src="app.js"></script>
    <script>
        let allPosts = [];
        let editingPostId = null;

        window.addEventListener('DOMContentLoaded', () => {
            fetchPosts();
        });

        function openWriteModal(postId = null) {
            const user = localStorage.getItem('currentUser');
            const role = localStorage.getItem('currentUserRole') || '일반회원';
            if (!user) return alert('로그인 후 이용 가능합니다.');

            const isAdmin = (role === '관리진' || role === '관리자');
            const catSelect = document.getElementById('postCategory');
            
            let options = `
                <option value="질문게시판">질문게시판</option>
                <option value="자랑게시판">자랑게시판</option>
            `;
            if (isAdmin) options = `<option value="공지게시판">공지게시판</option>` + options;
            catSelect.innerHTML = options;

            const modal = document.getElementById('writeModal');
            modal.style.display = 'flex';
            const deleteImgArea = document.getElementById('deleteImgArea');
            document.getElementById('deleteExistingImg').checked = false;

            if (postId) {
                const post = allPosts.find(p => p.id === postId);
                editingPostId = post.id;
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').value = post.content;
                catSelect.value = post.category || '질문게시판';
                document.getElementById('writeModalTitle').innerHTML = '<i class="fas fa-edit"></i> 게시글 수정';
                deleteImgArea.style.display = post.image_url ? 'block' : 'none';
            } else {
                editingPostId = null;
                document.getElementById('postForm').reset();
                document.getElementById('writeModalTitle').innerHTML = '<i class="fas fa-pen-nib"></i> 새 게시글 작성';
                deleteImgArea.style.display = 'none';
            }
        }

        function closeWriteModal() {
            document.getElementById('writeModal').style.display = 'none';
            editingPostId = null;
        }

        async function fetchPosts() {
            try {
                const { data, error } = await db.from('posts').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allPosts = data;

                const list = document.getElementById('postList');
                if(data.length === 0){
                    list.innerHTML = '<p style="text-align:center;">등록된 게시글이 없습니다.</p>';
                    return;
                }

                list.innerHTML = data.map(post => `
                    <div class="post-item" onclick="openDetailModal(${post.id})">
                        <span class="post-cat-badge ${post.category === '공지게시판' ? 'admin-notice' : ''}">${post.category || '질문게시판'}</span>
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">
                            <span><i class="fas fa-user"></i> ${post.author}</span>
                            <span><i class="fas fa-clock"></i> ${new Date(post.created_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function openDetailModal(id) {
            const post = allPosts.find(p => p.id === id);
            const user = localStorage.getItem('currentUser');
            const role = localStorage.getItem('currentUserRole');
            const isAdmin = (role === '관리진' || role === '관리자');
            const canEdit = (user === post.author || isAdmin);
            
            const adminButtons = canEdit ? `
                <div style="display:flex; gap:10px; margin-top: 15px;">
                    <button class="btn-auth" onclick='closeDetailModal(); openWriteModal(${post.id});'>수정하기</button>
                    <button class="btn-logout" onclick="deletePost(${post.id})">삭제하기</button>
                </div>
            ` : '';

            document.getElementById('detailContent').innerHTML = `
                <div class="modal-header">
                    <span class="post-cat-badge">${post.category || '질문게시판'}</span>
                    <button class="modal-close" onclick="closeDetailModal()">&times;</button>
                </div>
                <h3 style="margin: 10px 0;">${post.title}</h3>
                <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px;">작성자: ${post.author}</p>
                ${post.image_url ? `<img src="${post.image_url}" style="width:100%; border-radius:10px; margin-bottom:20px;">` : ''}
                <div style="white-space: pre-wrap; line-height: 1.6;">${post.content}</div>
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">
                ${adminButtons}
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        async function submitPost(e) {
            e.preventDefault();
            const user = localStorage.getItem('currentUser');
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const category = document.getElementById('postCategory').value;
            const imageInput = document.getElementById('postImage');
            const deleteExisting = document.getElementById('deleteExistingImg').checked;

            let imageUrl = undefined;
            if (deleteExisting) imageUrl = null;

            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `post_${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
                const { error: uploadError } = await db.storage.from('images').upload(fileName, file);
                if (uploadError) return alert('이미지 업로드 실패: ' + uploadError.message);
                imageUrl = db.storage.from('images').getPublicUrl(fileName).data.publicUrl;
            }

            let query;
            if (editingPostId) {
                const updateData = { title, content, category };
                if (imageUrl !== undefined) updateData.image_url = imageUrl;
                query = db.from('posts').update(updateData).eq('id', editingPostId);
            } else {
                query = db.from('posts').insert([{ title, content, category, author: user, image_url: imageUrl || null }]);
            }

            const { error } = await query;
            if (error) alert('등록 실패: ' + error.message);
            else {
                alert(editingPostId ? '수정되었습니다.' : '작성 완료!');
                closeWriteModal();
                fetchPosts();
            }
        }

        async function deletePost(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const { error } = await db.from('posts').delete().eq('id', id);
            if (error) alert('삭제 실패: ' + error.message);
            else {
                alert('삭제되었습니다.');
                closeDetailModal();
                fetchPosts();
            }
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.post-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
