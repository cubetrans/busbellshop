<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객센터 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="emergency-banner" style="display: none; background-color: #d9534f; color: white; padding: 10px; text-align: center; font-weight: bold; width: 100%; z-index: 1000;">
    🚨 <span id="emergency-text"></span>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline mypage-btn">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html" class="mobile-mypage-btn">마이페이지</a></li>
        <li><a href="login.html" class="mobile-auth-action">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <h2>고객센터 (1:1 문의)</h2>
    <div class="card">
      <h3>문의 작성하기</h3>
      <form id="inquiry-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="inquiry-title" placeholder="제목" required style="padding: 10px;">
        <textarea id="inquiry-content" placeholder="내용" rows="5" required style="padding: 10px;"></textarea>
        <button type="submit" class="btn btn-primary">문의 접수</button>
      </form>
    </div>
    <h3>나의 문의 내역</h3>
    <div id="inquiry-list" style="margin-top: 15px;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
