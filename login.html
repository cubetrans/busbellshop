<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 버스벨샵</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="icon.png" alt="logo" onerror="this.style.display='none'">
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
      </ul>
    </div>

    <div class="header-right">
      <span class="user-info user-greeting">로그인이 필요합니다</span>
      <button class="theme-toggle-btn">🌙</button>
      <a href="mypage.html" class="btn btn-outline auth-action">마이페이지</a>
      <a href="login.html" class="btn btn-primary auth-action">로그인</a>
      <button class="hamburger">☰</button>
    </div>

    <div class="mobile-menu">
      <div class="user-greeting mobile-user-greeting">로그인이 필요합니다</div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="market.html">장터</a></li>
        <li><a href="community.html">커뮤니티</a></li>
        <li><a href="support.html">고객센터</a></li>
        <li><a href="mypage.html">마이페이지</a></li>
        <li><a href="#" class="logout-btn">로그아웃</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="max-width: 400px; margin-top: 60px;">
    <div class="card">
      <h2>로그인</h2>
      <form id="login-form" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
        <input type="text" id="login-nickname" placeholder="닉네임 (예: 서울교덕)" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <input type="password" id="login-password" placeholder="비밀번호" required style="padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px;">
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Supabase 설정 (본인의 URL과 ANON_KEY를 입력하세요)
    const SUPABASE_URL = '여기에_본인의_Supabase_URL_입력';
    const SUPABASE_ANON_KEY = '여기에_본인의_Supabase_ANON_KEY_입력';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Supabase 연동 로그인 처리
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nicknameInput = document.getElementById('login-nickname').value.trim();
      const passwordInput = document.getElementById('login-password').value.trim();

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('nickname', nicknameInput)
          .eq('password', passwordInput)
          .single();

        if (error || !data) {
          alert('아이디(닉네임) 또는 비밀번호가 일치하지 않습니다.');
          return;
        }

        const currentUser = {
          username: data.nickname,
          role: data.role === '관리자' ? 'admin' : 'user',
          accountNum: data.account_number || '',
          bankName: data.bank_name || '',
          accountHolder: data.account_holder || ''
        };

        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert(`${currentUser.username}님 환영합니다!`);
        window.location.href = 'index.html';

      } catch (err) {
        console.error('로그인 오류:', err);
        alert('로그인 처리 중 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
